[tool.pytest.ini_options]
testpaths = ["tests"]
# SQLAlchemy internals used by MLflow; nothing we can act on
filterwarnings = ["ignore:The ``noload`` loader strategy"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Real errors only: undefined names, unused imports and variables, syntax errors.
select = ["F", "E9", "PLE"]
