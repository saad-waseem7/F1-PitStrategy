name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - run: ruff check src tests airflow
      - run: python -m pytest -q

  docker:
    name: Build image and smoke test
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      # The real model lives in DVC. CI uses a throwaway synthetic one to prove the image works.
      - name: Train a throwaway champion
        run: python -m tests.make_ci_champion --out models/champion
      - name: Build image
        run: docker build -t f1-pit-strategy:ci .
      - name: Start container
        run: docker run -d --name api -p 8000:8000 f1-pit-strategy:ci
      - name: Wait until ready
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/ready >/dev/null 2>&1; then echo "ready after ${i}s"; exit 0; fi
            sleep 1
          done
          docker logs api
          exit 1
      - name: Predict, and reject a wet compound
        run: |
          body='{"tyre_age":18,"compound":"MEDIUM","stint_number":1,"lap_number":22,"race_progress":0.38,"track_temperature":41,"air_temperature":28,"humidity":45,"wind_speed":2.5,"prev_gap_to_best":0.4,"recent_gap_to_best":0.5}'
          curl -fsS -X POST http://localhost:8000/predict -H 'content-type: application/json' -d "$body" | tee out.json
          python -c "import json; d=json.load(open('out.json')); assert 0 <= d['pit_probability'] <= 1, d"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8000/predict -H 'content-type: application/json' -d "${body/MEDIUM/WET}")
          test "$code" = "422" || { echo "expected 422 for WET, got $code"; exit 1; }
      - name: Container logs on failure
        if: failure()
        run: docker logs api

  airflow-dag:
    name: Airflow DAG parses and branches
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Airflow needs its own pinned dependency set, so it is installed apart from the project requirements.
      - run: >
          pip install "apache-airflow==2.10.5" pytest
          --constraint https://raw.githubusercontent.com/apache/airflow/constraints-2.10.5/constraints-3.11.txt
      - run: python -m pytest -q airflow/tests
